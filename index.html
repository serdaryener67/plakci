<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0b0a">
<title>Plakçı</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --bg:#0d0b0a;
    --ink:#f2ebe1;
    --muted:rgba(242,235,225,.52);
    --faint:rgba(242,235,225,.14);
    --amber:#e9b46f;
    --teal:#47d3c9;
    --serif:"Noto Serif", "Source Serif Pro", Georgia, serif;
    --sans:"Roboto", system-ui, sans-serif;
    --scene-h:56vh;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:var(--sans);user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
  #gl{z-index:0}
  #fx{z-index:1;pointer-events:none}
  #tap{z-index:15;pointer-events:none}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
  .sw.on{border-color:var(--ink)}
  #hit{position:fixed;inset:0;z-index:2;touch-action:none}

  /* sahnenin alt kenarını panele eriten geçiş (sadece dikey ekranda) */
  #fade{position:fixed;left:0;right:0;top:calc(var(--scene-h) - 110px);height:112px;z-index:3;pointer-events:none;
    background:linear-gradient(to bottom, rgba(13,11,10,0), var(--bg) 92%)}

  /* ---- Alt panel ---- */
  #panel{position:fixed;left:0;right:0;top:calc(var(--scene-h) - 26px);bottom:0;z-index:4;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:0 26px calc(18px + env(safe-area-inset-bottom));}
  .info{min-height:84px}
  #title{font-family:var(--serif);font-size:25px;line-height:1.18;font-weight:400;letter-spacing:.2px;
    margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #nextUp{margin-top:14px;font-family:var(--serif);font-style:italic;font-size:13px;color:rgba(242,235,225,.34);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #artist{margin-top:8px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .groove{position:relative;height:28px;margin-top:6px;touch-action:none}
  .groove .line{position:absolute;left:0;right:0;top:13px;height:1px;background:var(--faint)}
  .groove .fill{position:absolute;left:0;right:0;top:13px;height:1px;background:var(--amber);
    transform-origin:0 50%;transform:scaleX(0);will-change:transform}
  .times{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;letter-spacing:1px;margin-top:-4px}

  .controls{display:flex;align-items:center;justify-content:space-between;margin:10px 0 4px}
  .ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;opacity:.85;transition:opacity .2s, transform .15s}
  .ic:active{transform:scale(.92);opacity:1}
  .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .ic.small svg{width:18px;height:18px}
  #play{width:74px;height:74px;border:1px solid rgba(242,235,225,.28);position:relative;opacity:1}
  #play svg{width:26px;height:26px;fill:currentColor;stroke:none}
  #play::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(233,180,111,.0);
    transition:border-color .6s}
  body.playing #play::after{border-color:rgba(233,180,111,.35)}

  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chip{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
    padding:9px 13px;border:1px solid var(--faint);border-radius:999px;transition:color .2s,border-color .2s}
  .chip:active{color:var(--ink);border-color:rgba(242,235,225,.4)}
  .chip b{font-weight:500;color:var(--ink)}

  /* boş durum */
  #empty{display:none;text-align:center}
  body.empty #empty{display:block}
  body.empty .player-only{display:none}
  #empty p{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 22px}
  .btn{display:inline-block;padding:14px 26px;border:1px solid rgba(233,180,111,.55);border-radius:999px;
    color:var(--amber);letter-spacing:2.5px;font-size:11px;text-transform:uppercase}

  /* ---- Yatay ekran (telefon yatay, tablet, PC): panel sahnenin üstünde. body.land JS ile verilir ---- */
  body.land #fade{top:auto;bottom:0;height:46vh;background:linear-gradient(to bottom, rgba(13,11,10,0), rgba(13,11,10,.86) 75%)}
  body.land #panel{top:auto;height:auto;flex-direction:row;align-items:flex-end;gap:22px;
    padding:0 calc(26px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(26px + env(safe-area-inset-left))}
  body.land .info{flex:1;min-width:0;min-height:0}
  body.land #title{font-size:21px;-webkit-line-clamp:1}
  body.land .mid{position:absolute;left:var(--mid-x,50%);bottom:calc(14px + env(safe-area-inset-bottom));
    width:min(500px,40vw);transform:translateX(-50%)}
  body.land .info{max-width:calc(var(--mid-x,50vw) - min(250px,20vw) - 48px)}
  body.land .controls{margin:2px 0 0}
  body.land #play{width:60px;height:60px}
  body.land .chips{flex-direction:column;align-items:flex-end;gap:6px}
  body.land .chip{padding:7px 11px}
  body.land #empty{flex:1;text-align:left}

  /* ---- Alt sayfalar (kütüphane / atmosfer) ---- */
  .scrim{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:78vh;display:flex;flex-direction:column;
    background:rgba(20,17,15,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--faint);border-radius:22px 22px 0 0;
    transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);
    padding:10px 0 env(safe-area-inset-bottom)}
  .sheet.on{transform:none}
  .sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--faint);margin:2px auto 12px}
  .sheet h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 22px 4px}
  .sheet .sub{color:var(--muted);font-size:11px;letter-spacing:1.5px;margin:0 22px 12px}
  .row{display:flex;gap:8px;align-items:center;margin:0 22px 12px}
  #search{flex:1;background:transparent;border:1px solid var(--faint);border-radius:999px;color:var(--ink);
    padding:11px 16px;font:inherit;font-size:14px;outline:none}
  #list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 12px;flex:1}
  .trk{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:11px 12px;border-radius:12px}
  .trk:active{background:rgba(255,255,255,.04)}
  .trk .n{width:22px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;flex:none}
  .trk .t{min-width:0;flex:1}
  .trk .a{font-family:var(--serif);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trk .b{font-size:10.5px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trk.cur .a{color:var(--amber)}
  .trk.cur .n{color:var(--amber)}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin:0 22px 18px}
  .opt{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 14px;border-radius:999px;
    border:1px solid var(--faint);color:var(--muted)}
  .opt.on{border-color:rgba(233,180,111,.6);color:var(--amber)}
  .lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:6px 22px 10px}
  /* yatay ekranda alt sayfa sağdan açılır (taban kurallardan sonra gelmeli) */
  body.land .sheet{left:auto;top:0;width:min(440px,62vw);max-height:none;border-radius:22px 0 0 22px;
    border-top:0;border-left:1px solid var(--faint);transform:translateX(105%);
    padding-right:env(safe-area-inset-right)}
  body.land .sheet.on{transform:none}

  #toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));z-index:20;transform:translate(-50%,-8px);
    opacity:0;transition:opacity .35s, transform .35s;pointer-events:none;
    font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ink);
    padding:9px 16px;border-radius:999px;background:rgba(13,11,10,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #nogl{display:none;position:fixed;inset:0;z-index:0;background:url(scene.webp) center/cover}
</style>
</head>
<body class="empty">
<canvas id="gl"></canvas>
<canvas id="fx"></canvas>
<canvas id="tap"></canvas>
<div id="nogl"></div>
<div id="hit"></div>
<div id="fade"></div>

<div id="panel">
  <div class="info player-only">
    <h1 id="title">&nbsp;</h1>
    <div id="artist">&nbsp;</div>
    <div id="nextUp"></div>
  </div>

  <div id="empty">
    <h1 style="font-family:var(--serif);font-weight:400;font-size:24px;margin:0">Plak rafı boş</h1>
    <p>Telefondaki müzik klasörünü bir kez seç,<br>gerisini plakçı hatırlar.</p>
    <button class="btn" id="pickBtn">Klasör seç</button>
  </div>

  <div class="mid player-only">
    <div class="groove" id="groove">
      <div class="line"></div><div class="fill" id="fill"></div>
    </div>
    <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
    <div class="controls">
      <button class="ic small" id="stop" aria-label="Durdur"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
      <button class="ic" id="prev" aria-label="Önceki"><svg viewBox="0 0 24 24"><path d="M18 6 9 12l9 6V6zM6 6v12"/></svg></button>
      <button class="ic" id="play" aria-label="Çal"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5.5v13l11-6.5z"/></svg></button>
      <button class="ic" id="next" aria-label="Sonraki"><svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6V6zM18 6v12"/></svg></button>
      <button class="ic small" id="libBtn" aria-label="Kütüphane"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="17" r="2.2"/><path d="M20.2 17V10"/></svg></button>
    </div>
  </div>

  <div class="chips">
    <button class="chip" id="vizBtn">Görsel <b id="vizName">Bokeh</b></button>
    <button class="chip" id="atmoBtn">Atmosfer <b id="atmoName">Oto</b></button>
    <button class="chip player-only" id="orderBtn">Sıra <b id="orderName">Düz</b></button>
    <button class="chip" id="tapBtn">Dokunuş <b>Efekt</b></button>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="libSheet" aria-label="Kütüphane">
  <div class="grab"></div>
  <h3>Plak rafı</h3>
  <div class="sub" id="libInfo">0 parça</div>
  <div class="row">
    <input id="search" type="search" placeholder="Ara" autocomplete="off">
    <button class="chip" id="changeDir">Klasör</button>
  </div>
  <div id="list"></div>
</section>

<section class="sheet" id="tapSheet" aria-label="Dokunuş efektleri">
  <div class="grab"></div>
  <h3>Dokunuş efektleri</h3>
  <div class="sub">Önce tuşu seç, sonra efekt ve renk ata</div>
  <div style="overflow-y:auto;flex:1">
    <div class="lbl">Tuş</div>
    <div class="opts" id="tapTargets"></div>
    <div class="lbl">Efekt</div>
    <div class="opts" id="tapEffects"></div>
    <div class="lbl">Renk</div>
    <div class="opts" id="tapColors"></div>
    <div class="opts"><button class="opt" id="tapAll">Bu efekti tüm tuşlara uygula</button><button class="opt" id="tapReset">Varsayılana dön</button></div>
  </div>
</section>

<section class="sheet" id="atmoSheet" aria-label="Atmosfer">
  <div class="grab"></div>
  <h3>Atmosfer</h3>
  <div class="sub" id="atmoInfo">Hava durumu bekleniyor</div>
  <div class="lbl">Zaman</div>
  <div class="opts" id="timeOpts"></div>
  <div class="lbl">Hava</div>
  <div class="opts" id="wxOpts"></div>
</section>

<div id="toast"></div>
<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.flac,.ogg,.wav,.opus,.aac" multiple hidden>

<script>
'use strict';
/* ===========================================================
   Plakçı  |  sahne sabitleri (orijinal görsel piksel koordinatları)
   =========================================================== */
const STAGE_W = 1659, STAGE_H = 948;
const REC = { cx: 798, cy: 535, rx: 276, ry: 76, labelR: 103 };
const ARM = { pivotX: 1121, pivotY: 528, ke: 0.6, startDeg: 53, endDeg: 72, x: 1076, y: 446, w: 102, h: 213 };
const SHEEN_BOX = [520, 457, 556, 156];
const RPM = 27; // görsel dönüş hızı (gerçek 33⅓, gözde biraz sakin dursun)
const AUDIO_RE = /\.(mp3|m4a|aac|flac|ogg|oga|opus|wav)$/i;
// pencere camları ve camın önündeki bitki (efekt kırpma için)
const PANES = [
  [[146,0],[676,0],[676,420],[146,428]],
  [[779,0],[1224,0],[1218,412],[779,418]]
];
const PLANT = [[141,336],[160,312],[188,293],[198,283],[201,279],[241,266],[272,270],[291,289],[318,292],
  [345,309],[368,336],[376,355],[366,370],[392,361],[415,365],[438,378],[457,401],[466,426],[141,426]];

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

/* ---------- küçük kalıcı depo (IndexedDB) ---------- */
const kv = (() => {
  let dbp;
  const db = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('plakci', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => {
    const t = d.transaction('kv', mode); const q = fn(t.objectStore('kv'));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return { get: (k) => tx('readonly', s => s.get(k)), set: (k, v) => tx('readwrite', s => s.put(v, k)) };
})();
const store = {
  get(k, d) { try { const v = localStorage.getItem('plakci.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('plakci.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ===========================================================
   GÖRÜNÜM: sahneyi ekrana yerleştir (sadece resize'da hesaplanır)
   =========================================================== */
const view = { s: 1, tx: 0, ty: 0, dpr: 1, w: 0, h: 0, portrait: true };
function computeView() {
  const vw = innerWidth, vh = innerHeight;
  view.dpr = Math.min(devicePixelRatio || 1, 2);
  view.w = vw; view.h = vh;
  view.portrait = vh > vw * 1.05;
  document.body.classList.toggle('land', !view.portrait);
  if (view.portrait) {
    // dikey: pikap genişliği ekranı doldursun, sahne üstte
    view.s = Math.max(vw / 910, vh * .5 / STAGE_H);
    view.tx = clamp(vw / 2 - 875 * view.s, vw - STAGE_W * view.s, 0);
    view.ty = 0;
    document.documentElement.style.setProperty('--scene-h', (STAGE_H * view.s) + 'px');
  } else {
    // yatay: sahne ekranı kaplasın, pikap ortada
    view.s = Math.max(vw / STAGE_W, vh / STAGE_H) * 1.02;
    view.tx = clamp(vw / 2 - 875 * view.s, vw - STAGE_W * view.s, 0);
    view.ty = clamp(vh * 0.44 - 535 * view.s, vh - STAGE_H * view.s, 0);
  }
  // yatay ekranda kontroller plağın merkezine hizalanır
  const midX = clamp(view.tx + REC.cx * view.s, vw * .36, vw * .6);
  document.documentElement.style.setProperty('--mid-x', midX + 'px');
  for (const c of [glCanvas, fxCanvas, tapCanvas]) {
    c.width = Math.round(vw * view.dpr); c.height = Math.round(vh * view.dpr);
  }
}
function toStage(clientX, clientY) {
  return [(clientX - view.tx) / view.s, (clientY - view.ty) / view.s];
}

/* ===========================================================
   WEBGL SAHNE: arka plan + hava + ışık + plak + kol tek shader'da
   =========================================================== */
const glCanvas = $('gl'), fxCanvas = $('fx'), tapCanvas = $('tap');
const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });

const VS = `#version 300 es
in vec2 aP;
uniform vec4 uView; // s, tx, ty (cihaz pikseli)
uniform vec2 uRes;
out vec2 vP;
void main(){
  vP = aP;
  vec2 px = uView.yz + aP * uView.x;
  gl_Position = vec4(px.x / uRes.x * 2. - 1., 1. - px.y / uRes.y * 2., 0., 1.);
}`;

const FS = `#version 300 es
precision highp float;
in vec2 vP;
out vec4 outC;
uniform sampler2D uScene, uMaps, uDisc, uLabel, uSheen, uArm;
uniform float uT, uRot, uArmA, uArmLift, uKe;
uniform vec3 uAmb, uExtTint, uLampCol;
uniform float uExtBright, uNight, uLamp, uDay, uSat, uFog, uRain, uSnow, uWind, uFlash, uPulse, uGlow;
const vec2 STAGE = vec2(1659., 948.);
const vec2 RC = vec2(798., 535.);
const float RR = 276., RK = 76./276., LR = 103.;
const vec4 SHB = vec4(520., 457., 556., 156.);
const vec4 ARMB = vec4(1076., 446., 102., 213.);
const vec2 PIV = vec2(1121., 528.);

float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }

// camdaki yağmur damlaları: xy = kırılma ofseti, z = damla maskesi
vec3 rainGlass(vec2 p){
  vec3 acc = vec3(0.);
  for (int l = 0; l < 2; l++){
    float sc = l == 0 ? 24. : 13.;
    vec2 g = p / sc + float(l) * 17.3;
    vec2 id = floor(g); vec2 f = fract(g) - .5;
    float h = hash(id);
    vec2 c = (vec2(hash(id + 3.3), hash(id + 9.1)) - .5) * .5;
    float r = mix(.07, .2, h);
    float life = fract(uT * .05 + h * 7.);
    float show = step(.5, hash(id + floor(uT * .05 + h * 7.))) * smoothstep(0., .1, life) * smoothstep(1., .85, life);
    vec2 d = f - c;
    float m = smoothstep(r, r * .55, length(d * vec2(1., .9))) * show;
    acc.xy -= d * m * sc * 1.1;
    acc.z = max(acc.z, m);
  }
  // kayan damlalar
  float cw = 46.;
  float col = floor(p.x / cw);
  float h = hash(vec2(col, 4.1));
  float sp = 40. + h * 70.;
  float yd = mod(uT * sp + h * 900., STAGE.y * .55 + 60.) - 30.;
  float cx = (col + .5) * cw + sin(yd * .045 + h * 6.) * 6.;
  vec2 dd = vec2(p.x - cx, (p.y - yd) * .85);
  float m = smoothstep(5.5, 2.5, length(dd)) * step(.35, h);
  float trail = smoothstep(2.2, .6, abs(p.x - cx)) * smoothstep(0., -90., p.y - yd) * step(p.y, yd) * .5 * step(.35, h);
  acc.xy -= dd * m * 1.2;
  acc.z = max(acc.z, max(m, trail * .5));
  return acc;
}

// iç mekan ışığı: güneş lekelerini bastır, ortam rengi, lambalar
vec3 lightInterior(vec3 c, float sun, vec2 p){
  vec3 alb = c;
  c *= 1. - sun * (1. - uDay) * .82;
  c *= uAmb;
  vec2 L1 = vec2(-80., 160.);
  float d1 = length((p - L1) * vec2(1., 1.2));
  float f1 = 1. / (1. + pow(d1 / 640., 2.));
  vec2 L2 = vec2(1610., 330.);
  float d2 = length(p - L2);
  float f2 = .55 / (1. + pow(d2 / 430., 2.));
  float lamp = uLamp * (1. + uPulse * .07 + uGlow * .85);
  c += alb * sun * uGlow * uDay * .75;                    // ışık nabzı: güneş lekeleri ritimle parlar

const labelCanvas = document.createElement('canvas');

function drawLabel(track, art) {
  const c = labelCanvas.getContext('2d'), S = 512, R = 256;
  c.clearRect(0, 0, S, S);
  c.save();
  c.beginPath(); c.arc(R, R, R, 0, Math.PI * 2); c.clip();
  if (art) {
    const k = Math.max(S / art.width, S / art.height);
    c.drawImage(art, R - art.width * k / 2, R - art.height * k / 2, art.width * k, art.height * k);
    const g = c.createRadialGradient(R, R, R * .6, R, R, R);

    g.addColorStop(0, '#f4ead8'); g.addColorStop(1, '#e2d4bb');
    c.fillStyle = g; c.fillRect(0, 0, S, S);
    c.strokeStyle = 'rgba(120,90,60,.28)'; c.lineWidth = 1.2;
    for (const rr of [244, 236, 120]) { c.beginPath(); c.arc(R, R, rr, 0, Math.PI * 2); c.stroke(); }
    // kavisli yazı: dönüşü görünür kılar
    const txt = ('PLAKÇI  ·  33⅓  ·  SIDE A  ·  ' + ((track && track.artist) || 'PROMPTART') + '  ·  ').toUpperCase();
    c.fillStyle = 'rgba(80,58,38,.78)'; c.font = '500 19px Roboto, sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const rad = 205, step = (Math.PI * 2) / Math.max(txt.length, 40);
    for (let i = 0; i < txt.length; i++) {
      const a = -Math.PI / 2 + i * step;
      c.save(); c.translate(R + Math.cos(a) * rad, R + Math.sin(a) * rad); c.rotate(a + Math.PI / 2);
      c.fillText(txt[i], 0, 0); c.restore();
    }
    // başlık
    c.fillStyle = 'rgba(60,40,26,.9)'; c.font = 'italic 34px "Noto Serif", Georgia, serif';
    const title = ((track && track.title) || 'Plakçı');
    const words = title.split(' '); let line = '', lines = [];
    for (const w of words) { const t2 = line ? line + ' ' + w : w; if (c.measureText(t2).width > 250 && line) { lines.push(line); line = w; } else line = t2; }
    lines.push(line); lines = lines.slice(0, 2);

  }

  c.fillStyle = '#1a1714'; c.beginPath(); c.arc(R, R, 14, 0, Math.PI * 2); c.fill();

}

  await armTo(0, 850); if (myseq !== seq) return;
  await liftTo(0, 300); if (myseq !== seq) return;

async function loadTrack(idx, autoplay, startAt) {
  const t = tracks[idx]; if (!t) return;
  cur = idx;
  let file;
  try { file = t.file || await t.handle.getFile(); }
  catch (e) { toast('Dosya açılamadı'); return; }
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(file);
  audio.src = objUrl;
  if (startAt) audio.addEventListener('loadedmetadata', () => { try { audio.currentTime = startAt; } catch (e) {} }, { once: true });
  // etiket ve meta
  const tags = await readTags(file);
  if (tags.title) t.title = tags.title;
  if (tags.artist) t.artist = tags.artist;
  $('title').textContent = t.title || t.name;
  $('artist').textContent = [t.artist, tags.album].filter(Boolean).join('  ·  ') || ' ';
  let art = null;
  if (artUrl) { URL.revokeObjectURL(artUrl); artUrl = null; }
  if (tags.pic) {
    try { art = await createImageBitmap(tags.pic); artUrl = URL.createObjectURL(tags.pic); } catch (e) { art = null; }
  }
  drawLabel(t, art);
  updateMediaSession(t, tags);
  markCurrent();
  const row = $('list').querySelector(`.trk[data-i="${idx}"]`);
  if (row) { row.querySelector('.a').textContent = t.title || t.name; if (t.artist) row.querySelector('.b').textContent = t.artist; }
  updateNextUp();
  store.set('last', { path: t.path, time: startAt || 0 });

}

async function startPlayback() {
  if (cur < 0) { if (tracks.length) await loadTrack(order[pos = 0], false); else return pickFolder(); }
  ensureAudioGraph();
  wantPlay = true;
  const my = ++seq;
  platterTarget = 1;
  document.body.classList.add('playing');
  setPlayIcon(true);
  const ok = await cueDown(my);
  if (!ok || my !== seq) return;
  audio.playbackRate = 1;
  if (gainNode) { gainNode.gain.cancelScheduledValues(actx.currentTime); gainNode.gain.setValueAtTime(0, actx.currentTime); gainNode.gain.linearRampToValueAtTime(1, actx.currentTime + .25); }
  try { await audio.play(); isPlaying = true; }
  catch (e) { console.warn(e); toast('Çalmak için dokun'); stopPlayback(false); }
}

async function vinylStop() {
  if (!isPlaying) return;
  const r0 = audio.playbackRate;
  await tween(.32, k => { audio.playbackRate = Math.max(.25, lerp(r0, .3, k)); if (gainNode) gainNode.gain.value = 1 - k; });
  audio.pause(); audio.playbackRate = 1;

}
async function stopPlayback(reset) {

  const my = ++seq;
  document.body.classList.remove('playing');
  setPlayIcon(false);
  platterTarget = 0;
  await vinylStop();
  if (reset) audio.currentTime = 0;
  saveLast();
  if (my === seq) cueRest(my);
}
// duraklat: ses susar, iğne plağın üstünde hafifçe kalkık bekler, tabla dönmeye devam eder
async function pausePlayback() {
  if (!wantPlay && !isPlaying) return;
  wantPlay = false;
  const my = ++seq;
  document.body.classList.remove('playing');
  setPlayIcon(false);
  if (isPlaying) {
    await tween(.15, k => { if (gainNode) gainNode.gain.value = 1 - k; });
    audio.pause(); if (gainNode) gainNode.gain.value = 1;
    isPlaying = false;
  }
  saveLast();
  if (my !== seq) return;
  armMode = 'moving';
  await liftTo(6, 260);
  if (my === seq) armMode = 'paused';
}
function togglePlay() { if (wantPlay) pausePlayback(); else startPlayback(); }

async function go(dir) {
  if (!tracks.length) return;
  const wasPlaying = wantPlay;
  if (audio.currentTime > 4 && dir < 0) { seekTo(0); return; }
  pos = (pos + dir + order.length) % order.length;
  const my = ++seq;
  if (wasPlaying) {
    armMode = 'moving';
    await vinylStop();
    await liftTo(7, 160);
    if (my !== seq) return;
  }
  await loadTrack(order[pos], false, 0);
  if (wasPlaying && my === seq) startPlayback();
  else if (armMode === 'paused') armTo(progressAngle(), 400);
}
function onEnded() {
  isPlaying = false;
  if (orderMode === 'repeat1') { audio.currentTime = 0; startPlayback(); return; }
  if (pos >= order.length - 1 && orderMode !== 'shuffle') { stopPlayback(true); return; }
  wantPlay = true;
  go(1);
}

async function seekTo(t) {
  if (!audio.duration) return;
  audio.currentTime = clamp(t, 0, audio.duration - .2);
  if (armMode === 'paused') { armTo(progressAngle(), 300); return; }
  if (armMode === 'tracking') {
    const my = seq; armMode = 'moving';
    await liftTo(5, 120); await armTo(progressAngle(), 320); await liftTo(0, 160);
    if (my === seq && wantPlay) armMode = 'tracking';
  }
}
function saveLast() { if (cur >= 0) store.set('last', { path: tracks[cur].path, time: audio.currentTime || 0 }); }
document.addEventListener('visibilitychange', () => { if (document.hidden) saveLast(); });

/* ---------- Media Session (kilit ekranı ve bildirim kontrolleri) ---------- */
function updateMediaSession(t, tags) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: t.title || t.name, artist: t.artist || '', album: tags.album || 'Plakçı',
    artwork: artUrl ? [{ src: artUrl, sizes: '512x512', type: tags.pic.type }] : [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }]
  });
}
if ('mediaSession' in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler('play', () => startPlayback());
  ms.setActionHandler('pause', () => pausePlayback());
  ms.setActionHandler('stop', () => stopPlayback(true));
  ms.setActionHandler('previoustrack', () => go(-1));
  ms.setActionHandler('nexttrack', () => go(1));
  try { ms.setActionHandler('seekto', (d) => seekTo(d.seekTime)); } catch (e) {}
}

/* ===========================================================
   ANA DÖNGÜ
   =========================================================== */
let lastT = performance.now(), lastRender = 0, raf = 0, glReady = false;
let lastSec = -1;
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  // boşta ve hareketsiz havada 30 fps yeter: pil dostu
  const c = atmo.cur || {};
  const busy = isPlaying || tweens.length || platterSpeed > .01 || c.rain > .02 || c.snow > .02 || c.wind > .2 || c.fog > .05 || vizMode !== 'off';
  if (!busy && now - lastRender < 33) return;
  const fdt = Math.min(.1, (now - lastRender) / 1000) || dt; lastRender = now;
  T += fdt;
  stepTweens(fdt);
  stepAtmo(fdt);
  readSpectrum(fdt);
  platterSpeed += (platterTarget - platterSpeed) * (1 - Math.exp(-fdt * (platterTarget ? 2.6 : 1.4)));
  rot += platterSpeed * (RPM / 60) * Math.PI * 2 * fdt;
  if (armMode === 'tracking') armA += (progressAngle() - armA) * (1 - Math.exp(-fdt * 3));
  // küçük titreşim: iğne bas ile hafifçe titrer
  const jitter = isPlaying && vizMode !== 'off' ? levels.bass * .07 * Math.sin(T * 47) : 0;
  if (glReady) drawGL(jitter);
  drawFX(fdt);
  // ilerleme çubuğu: sadece transform yazıyoruz (layout yok)
  if (audio.duration) {
    $('fill').style.transform = `scaleX(${audio.currentTime / audio.duration})`;
    const sec = Math.floor(audio.currentTime);
    if (sec !== lastSec) { lastSec = sec; $('tCur').textContent = fmt(sec); $('tDur').textContent = fmt(audio.duration); }
  }
}
function fmt(s) { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function drawGL(jitter) {
  const c = atmo.cur || PRESETS.day;
  gl.viewport(0, 0, glCanvas.width, glCanvas.height);
  gl.clearColor(13 / 255, 11 / 255, 10 / 255, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform4f(U.uView, view.s * view.dpr, view.tx * view.dpr, view.ty * view.dpr, 0);
  gl.uniform2f(U.uRes, glCanvas.width, glCanvas.height);
  gl.uniform1f(U.uT, T);
  gl.uniform1f(U.uRot, rot % (Math.PI * 2));
  gl.uniform1f(U.uArmA, armA);
  gl.uniform1f(U.uArmLift, armLift + jitter);
  gl.uniform1f(U.uKe, ARM.ke);
  gl.uniform3fv(U.uAmb, c.amb); gl.uniform3fv(U.uExtTint, c.extTint); gl.uniform3fv(U.uLampCol, LAMP_COL);
  gl.uniform1f(U.uExtBright, c.extBright); gl.uniform1f(U.uNight, c.night); gl.uniform1f(U.uLamp, c.lamp);
  gl.uniform1f(U.uDay, c.day); gl.uniform1f(U.uSat, c.sat);
  gl.uniform1f(U.uFog, c.fog || 0); gl.uniform1f(U.uRain, c.rain || 0); gl.uniform1f(U.uSnow, c.snow || 0);
  gl.uniform1f(U.uWind, c.wind || 0); gl.uniform1f(U.uFlash, atmo.flash || 0);
  gl.uniform1f(U.uPulse, vizMode !== 'off' ? levels.bass : 0);
  gl.uniform1f(U.uGlow, vizMode === 'pulse' ? glowS : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

      x.fillStyle = rgba(o.c, 1); x.shadowColor = rgba(o.c, 1); x.shadowBlur = 8;
      const n = 26;
      for (let i = 0; i < n; i++) {
        const f = i / n, a = f * TAU * 1.6 + k * 4, d = o.r * (.9 + f * 1.8 * outE(k));
        x.globalAlpha = (1 - k) * (1 - f * .6);
        x.beginPath(); x.arc(o.x + Math.cos(a) * d, o.y + Math.sin(a) * d, 2.4 * (1 - f * .5), 0, TAU); x.fill();
      }
      x.globalAlpha = 1;
    } },
  { id: 'embers', name: 'Kor', dur: 1.9,
    init(o) { o.p = Array.from({ length: 26 }, () => ({ x: rnd(-1.1, 1.1), v: rnd(50, 130), w: rnd(0, TAU), s: rnd(2, 4.2) })); },
    draw(x, k, o) { // yukarı süzülen titrek kor parçaları
      x.shadowColor = rgba(o.c, 1); x.shadowBlur = 16;
      const t = k * this.dur;
      for (const p of o.p) {
        const px = o.x + p.x * o.r + Math.sin(t * 5 + p.w) * 6, py = o.y - p.v * t;
        const fl = .6 + .4 * Math.sin(t * 22 + p.w);
        x.fillStyle = rgba(o.c, (1 - k) * fl);
        x.beginPath(); x.arc(px, py, p.s * (1 - k * .5), 0, TAU); x.fill();
      }
    } },
  { id: 'prism', name: 'Prizma', dur: 1.3,
    draw(x, k, o) { // kromatik kayma: üç renk halka
      const r = o.r * (1 + outE(k) * 1.5), a = (1 - k) * .8, sp = 4 + k * 10;
      x.lineWidth = 3 * (1 - k) + 1; x.shadowBlur = 12;
      const cols = [[255, 70, 90], [70, 255, 160], [90, 140, 255]];
      cols.forEach((cc, i) => {
        const ang = i * TAU / 3 + k * 2;
        x.shadowColor = rgba(cc, a); x.strokeStyle = rgba(cc, a);
        x.beginPath(); x.arc(o.x + Math.cos(ang) * sp, o.y + Math.sin(ang) * sp, r, 0, TAU); x.stroke();
      });
      x.strokeStyle = rgba(o.c, a * .5); x.lineWidth = 1;
      x.beginPath(); x.arc(o.x, o.y, r, 0, TAU); x.stroke();
    } },
  { id: 'drop', name: 'Damla', dur: 1.5,
    init(o) { o.p = Array.from({ length: 12 }, () => ({ a: rnd(Math.PI * 1.05, Math.PI * 1.95), v: rnd(60, 150) })); },
    draw(x, k, o) { // yukarıdan düşen damla, sıçrama ve halka
      x.shadowColor = rgba(o.c, 1); x.shadowBlur = 10;
      if (k < .25) {
        const kk = k / .25, y = o.y - o.r * 3 * (1 - kk * kk);
        x.fillStyle = rgba(o.c, .95);
        x.beginPath(); x.ellipse(o.x, y, 3.5, 6, 0, 0, TAU); x.fill();
        return;
      }
      const kk = (k - .25) / .75, t = kk * this.dur * .75;
      for (const p of o.p) {
        const d = p.v * t, g = 260 * t * t;
        x.fillStyle = rgba(o.c, 1 - kk);
        x.beginPath(); x.arc(o.x + Math.cos(p.a) * d, o.y + Math.sin(p.a) * d + g, 2, 0, TAU); x.fill();
      }
      x.shadowBlur = 0;
      x.strokeStyle = rgba(o.c, (1 - kk) * .7); x.lineWidth = 1.5;
      const r = o.r * (.3 + outE(kk) * 2);
      x.beginPath(); x.ellipse(o.x, o.y + 4, r, r * .35, 0, 0, TAU); x.stroke();
    } },
  { id: 'orbit', name: 'Yörünge', dur: 1.5,
    draw(x, k, o) { // ters yönde dönen iki ışık başı, kuyruklarıyla
      const r = o.r * 1.3, fade = Math.sin(k * Math.PI), turn = outE(k) * TAU * 1.4;
      const c2 = [Math.min(255, o.c[0] + 90), Math.min(255, o.c[1] + 90), Math.min(255, o.c[2] + 90)];
      x.lineCap = 'round'; x.shadowBlur = 14;
      for (const [dir, col] of [[1, o.c], [-1, c2]]) {
        const head = -Math.PI / 2 + turn * dir;
        x.shadowColor = rgba(col, 1);
        for (let i = 0; i < 12; i++) {
          const a = head - i * .11 * dir;
          x.strokeStyle = rgba(col, fade * (1 - i / 12)); x.lineWidth = 4.5 * (1 - i / 12) + .6;
          x.beginPath(); dir > 0 ? x.arc(o.x, o.y, r, a - .12, a) : x.arc(o.x, o.y, r, a, a + .12); x.stroke();
        }
      }
    } },
  { id: 'comet', name: 'Kuyruklu yıldız', dur: 1.6,
    draw(x, k, o) { // dışa açılan sarmalda uzun kuyruklu ışık
      const pos = (kk) => { const a = -Math.PI / 2 + kk * TAU * 1.5, r = o.r * (1.05 + kk * 1.2); return [o.x + Math.cos(a) * r, o.y + Math.sin(a) * r]; };
      const fade = k < .8 ? 1 : (1 - k) / .2;
      x.shadowColor = rgba(o.c, 1); x.shadowBlur = 16; x.lineCap = 'round';
      let prev = pos(k);
      for (let i = 1; i < 22; i++) {
        const kk = Math.max(0, k - i * .014), p = pos(kk);
        x.strokeStyle = rgba(o.c, fade * (1 - i / 22)); x.lineWidth = 5 * (1 - i / 22) + .5;
        x.beginPath(); x.moveTo(prev[0], prev[1]); x.lineTo(p[0], p[1]); x.stroke();
        prev = p;
      }
      const h = pos(k);
      x.fillStyle = rgba([255, 255, 255], fade); x.beginPath(); x.arc(h[0], h[1], 2.6, 0, TAU); x.fill();
    } },
  { id: 'radar', name: 'Radar', dur: 1.6,
    init(o) { o.p = Array.from({ length: 4 }, () => ({ a: Math.random() * TAU, d: rnd(.5, 1.3) })); },
    draw(x, k, o) { // dönen tarama dilimi ve beliren noktalar
      const R = o.r * 1.5, head = -Math.PI / 2 + k * TAU * 1.1, fade = Math.sin(k * Math.PI);
      x.strokeStyle = rgba(o.c, fade * .35); x.lineWidth = 1;
      x.beginPath(); x.arc(o.x, o.y, R, 0, TAU); x.stroke();
      for (let i = 0; i < 10; i++) {
        const a = head - i * .07;
        x.fillStyle = rgba(o.c, fade * .26 * (1 - i / 10));
        x.beginPath(); x.moveTo(o.x, o.y); x.arc(o.x, o.y, R, a - .07, a); x.closePath(); x.fill();
      }
      x.shadowColor = rgba(o.c, 1); x.shadowBlur = 10;
      for (const p of o.p) {
        let da = ((head - p.a) % TAU + TAU) % TAU; if (da > 2.5) continue;
        x.fillStyle = rgba(o.c, fade * (1 - da / 2.5));
        x.beginPath(); x.arc(o.x + Math.cos(p.a) * R * p.d * .7, o.y + Math.sin(p.a) * R * p.d * .7, 2.8, 0, TAU); x.fill();
      }
    } },
  { id: 'trace', name: 'Kontur izi', dur: 1.5,
    draw(x, k, o) { // tepeden iki yöne çizilen, altta buluşup parlayan çember
      const r = o.r * 1.15, top = -Math.PI / 2, a = Math.min(1, k / .5) * Math.PI;
      const glow = k > .5 ? Math.sin(((k - .5) / .5) * Math.PI) : 0, fade = k > .5 ? 1 - (k - .5) / .5 : 1;
      x.shadowColor = rgba(o.c, 1); x.shadowBlur = 12 + glow * 20; x.lineCap = 'round';
      x.strokeStyle = rgba(o.c, fade * .95); x.lineWidth = 2.4 + glow * 3;
      x.beginPath(); x.arc(o.x, o.y, r, top, top + a); x.stroke();
      x.beginPath(); x.arc(o.x, o.y, r, top - a, top); x.stroke();
      if (k < .5) {
        x.fillStyle = rgba([255, 255, 255], .95);
        for (const s of [1, -1]) { const h = top + a * s; x.beginPath(); x.arc(o.x + Math.cos(h) * r, o.y + Math.sin(h) * r, 2.6, 0, TAU); x.fill(); }
      }
    } },
  { id: 'vortex', name: 'Girdap', dur: 1.4,
    draw(x, k, o) { // dışarıdan içeri doğru dönerek çekilen yaylar
      x.shadowColor = rgba(o.c, 1); x.shadowBlur = 12; x.lineCap = 'round';
      for (let i = 0; i < 7; i++) {
        const kk = clamp(k * 1.25 - i * .04, 0, 1);
        const r = o.r * (2.4 - outE(kk) * 1.35) * (1 - i * .04);
        const a = i * .9 + kk * 7;
        x.strokeStyle = rgba(o.c, Math.sin(kk * Math.PI) * (1 - i * .08)); x.lineWidth = 2.2;
        x.beginPath(); x.arc(o.x, o.y, Math.max(2, r), a, a + 1.1); x.stroke();
      }
    } }
];
const TAP_BY_ID = Object.fromEntries(TAP_EFFECTS.map(e => [e.id, e]));

// atanabilir tuşlar ve varsayılanlar (her tuş farklı)
const TAP_TARGETS = [
  ['play', 'Çal'], ['stop', 'Durdur'], ['prev', 'Önceki'], ['next', 'Sonraki'], ['libBtn', 'Raf'],
  ['vizBtn', 'Görsel'], ['atmoBtn', 'Atmosfer'], ['orderBtn', 'Sıra'], ['tapBtn', 'Dokunuş'], ['record', 'Plak']
];
const TAP_DEFAULTS = {
  play: ['halo', '#e9b46f'], stop: ['shock', '#ff6b6b'], prev: ['sweep', '#47d3c9'], next: ['sparks', '#ffd166'],
  libBtn: ['stars', '#f2ebe1'], vizBtn: ['bokeh', '#47d3c9'], atmoBtn: ['smoke', '#b28dff'],
  orderBtn: ['spiral', '#7ee081'], tapBtn: ['prism', '#f2ebe1'], record: ['pulse', '#e9b46f']
};
let tapMap = Object.assign({}, TAP_DEFAULTS, store.get('tapMap', {}));
// kaldırılan efektler kayıtlıysa Işık süpürme ile değiştir
for (const k in tapMap) if (!TAP_BY_ID[tapMap[k][0]]) tapMap[k] = ['sweep', tapMap[k][1]];
const tapActive = [];
let tapRaf = 0, tapLast = 0;

function spawnTap(effectId, color, cx, cy, r) {
  const e = TAP_BY_ID[effectId]; if (!e) return;
  const o = { x: cx, y: cy, r: Math.max(14, r), c: hexRgb(color), t: 0, e };
  if (e.init) e.init(o);
  tapActive.push(o);
  if (!tapRaf) { tapLast = performance.now(); tapRaf = requestAnimationFrame(tapFrame); }
}
function tapFrame(now) {
  const dt = Math.min(.05, (now - tapLast) / 1000); tapLast = now;
  const d = view.dpr;
  tapCtx.setTransform(1, 0, 0, 1, 0, 0);
  tapCtx.clearRect(0, 0, tapCanvas.width, tapCanvas.height);
  tapCtx.setTransform(d, 0, 0, d, 0, 0);
  tapCtx.globalCompositeOperation = 'lighter';
  for (let i = tapActive.length - 1; i >= 0; i--) {
    const o = tapActive[i]; o.t += dt;
    const k = o.t / o.e.dur;
    if (k >= 1) { tapActive.splice(i, 1); continue; }
    tapCtx.save(); o.e.draw.call(o.e, tapCtx, k, o); tapCtx.restore();
  }
  tapRaf = tapActive.length ? requestAnimationFrame(tapFrame) : 0;
  if (!tapRaf) { tapCtx.setTransform(1, 0, 0, 1, 0, 0); tapCtx.clearRect(0, 0, tapCanvas.width, tapCanvas.height); }
}
// tuşa basılınca: rect sadece dokunuş anında bir kez okunur
function fireTap(target, el, x, y) {
  const m = tapMap[target]; if (!m) return;
  if (el) { const b = el.getBoundingClientRect(); spawnTap(m[0], m[1], b.left + b.width / 2, b.top + b.height / 2, Math.max(b.width, b.height) / 2); }
  else spawnTap(m[0], m[1], x, y, 34);
}
for (const [id] of TAP_TARGETS) {
  if (id === 'record') continue;
  const el = $(id); if (el) el.addEventListener('pointerdown', () => fireTap(id, el));
}

// ---- efekt atama menüsü
let tapSel = 'play';
function renderTapUI() {
  const mk = (box, items, isOn, onPick, cls) => {
    box.innerHTML = '';
    for (const [k, label] of items) {
      const b = document.createElement('button'); b.className = (cls || 'opt') + (isOn(k) ? ' on' : '');
      if (cls === 'sw') { b.style.background = k; b.setAttribute('aria-label', k); } else b.textContent = label;
      b.addEventListener('click', () => onPick(k, b.getBoundingClientRect())); box.appendChild(b);
    }
  };
  const cur = tapMap[tapSel];
  mk($('tapTargets'), TAP_TARGETS, k => k === tapSel, (k) => { tapSel = k; renderTapUI(); });
  mk($('tapEffects'), TAP_EFFECTS.map(e => [e.id, e.name]), k => k === cur[0], (k, b) => {
    tapMap[tapSel] = [k, tapMap[tapSel][1]]; saveTap(); renderTapUI(); previewAt(b);
  });
  mk($('tapColors'), TAP_COLORS.map(c => [c, c]), k => k === cur[1], (k, b) => {
    tapMap[tapSel] = [tapMap[tapSel][0], k]; saveTap(); renderTapUI(); previewAt(b);
  }, 'sw');
}
function previewAt(b) {
  // b: tıklanan tuşun konumu (liste yeniden çizilmeden önce okunur)
  const m = tapMap[tapSel];
  spawnTap(m[0], m[1], b.left + b.width / 2, b.top + b.height / 2, Math.max(28, b.height / 2 + 6));
}
function saveTap() { store.set('tapMap', tapMap); }
$('tapBtn').onclick = () => { renderTapUI(); openSheet('tapSheet'); };
$('tapAll').onclick = (e) => {
  const m = tapMap[tapSel];
  for (const [id] of TAP_TARGETS) tapMap[id] = [m[0], tapMap[id][1]];
  saveTap(); renderTapUI(); previewAt(e.currentTarget.getBoundingClientRect()); toast('Tüm tuşlara uygulandı');
};
$('tapReset').onclick = (e) => { tapMap = Object.assign({}, TAP_DEFAULTS); saveTap(); renderTapUI(); previewAt(e.currentTarget.getBoundingClientRect()); };

/* ===========================================================
   ARAYÜZ
   =========================================================== */
function setPlayIcon(on) {
  $('playIcon').innerHTML = on ? '<rect x="7" y="5.5" width="3.4" height="13" rx="1"/><rect x="13.6" y="5.5" width="3.4" height="13" rx="1"/>' : '<path d="M8 5.5v13l11-6.5z"/>';
  $('play').setAttribute('aria-label', on ? 'Duraklat' : 'Çal');
}
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1600);
}
function openSheet(id) { $(id).classList.add('on'); $('scrim').classList.add('on'); }
function closeSheets() { document.querySelectorAll('.sheet.on').forEach(s => s.classList.remove('on')); $('scrim').classList.remove('on'); }
$('scrim').onclick = closeSheets;
// tutamaca dokun ya da aşağı kaydır: kapat
document.querySelectorAll('.sheet').forEach(sh => {
  sh.querySelector('.grab').onclick = closeSheets;
  let y0 = null;
  sh.addEventListener('touchstart', (e) => { y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener('touchend', (e) => {
    if (y0 != null && e.changedTouches[0].clientY - y0 > 90 && !$('list').contains(e.target)) closeSheets();
    y0 = null;
  }, { passive: true });
});

// liste parça parça çizilir: binlerce şarkıda bile açılış hızlı kalır
let listIdx = [], listShown = 0;
const LIST_CHUNK = 120;
function renderList(filter) {
  const f = (filter || '').toLocaleLowerCase('tr');
  listIdx = [];
  tracks.forEach((t, i) => { if (!f || (t.title + ' ' + t.artist + ' ' + t.path).toLocaleLowerCase('tr').includes(f)) listIdx.push(i); });
  listShown = 0;
  $('list').replaceChildren();
  appendList();
}
function appendList() {
  const frag = document.createDocumentFragment();
  const end = Math.min(listIdx.length, listShown + LIST_CHUNK);
  for (let k = listShown; k < end; k++) {
    const i = listIdx[k], t = tracks[i];
    const b = document.createElement('button'); b.className = 'trk' + (i === cur ? ' cur' : ''); b.dataset.i = i;
    b.innerHTML = `<span class="n">${i + 1}</span><span class="t"><div class="a"></div><div class="b"></div></span>`;
    b.querySelector('.a').textContent = t.title || t.name;
    b.querySelector('.b').textContent = t.artist || t.path.split('/').slice(-2, -1)[0] || '';
    frag.appendChild(b);
  }
  listShown = end;
  $('list').appendChild(frag);
}
$('list').addEventListener('scroll', (e) => {
  const l = e.target;
  if (listShown < listIdx.length && l.scrollTop + l.clientHeight > l.scrollHeight - 600) appendList();
}, { passive: true });
function markCurrent() {
  const prev = $('list').querySelector('.trk.cur'); if (prev) prev.classList.remove('cur');
  const now = $('list').querySelector(`.trk[data-i="${cur}"]`); if (now) now.classList.add('cur');
}
$('list').addEventListener('click', async (e) => {
  const b = e.target.closest('.trk'); if (!b) return;
  const i = +b.dataset.i; pos = order.indexOf(i);
  closeSheets();
  const was = wantPlay;
  const my = ++seq;
  if (was) { armMode = 'moving'; await vinylStop(); await liftTo(7, 160); if (my !== seq) return; }
  await loadTrack(i, false, 0);
  if (my === seq) startPlayback();
});
let searchTimer;
$('search').addEventListener('input', (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => renderList(e.target.value), 140); });

$('play').onclick = togglePlay;
$('stop').onclick = () => stopPlayback(true);
$('next').onclick = () => go(1);
$('prev').onclick = () => go(-1);
$('libBtn').onclick = () => openSheet('libSheet');
$('pickBtn').onclick = pickFolder;
$('changeDir').onclick = () => { closeSheets(); pickFolder(); };
$('atmoBtn').onclick = () => { updateAtmoUI(); openSheet('atmoSheet'); };
$('vizBtn').onclick = () => {
  vizMode = VIZ[(VIZ.indexOf(vizMode) + 1) % VIZ.length];
  store.set('viz', vizMode); $('vizName').textContent = vizLabel(vizMode); toast(vizLabel(vizMode));
};
const ORDER_NAMES = { linear: 'Düz', shuffle: 'Karışık', repeat1: 'Tekrar' };
$('orderBtn').onclick = () => {
  const keys = Object.keys(ORDER_NAMES);
  orderMode = keys[(keys.indexOf(orderMode) + 1) % keys.length];
  store.set('order', orderMode); $('orderName').textContent = ORDER_NAMES[orderMode];
  const curIdx = order[pos]; buildOrder(); pos = Math.max(0, order.indexOf(curIdx)); updateNextUp();
};

// ilerleme çizgisinde sürükleyerek arama (rect sadece dokunuş başında okunur)
(() => {
  const g = $('groove'); let rect = null;
  const at = (x) => clamp((x - rect.left) / rect.width, 0, 1) * (audio.duration || 0);
  g.addEventListener('pointerdown', (e) => { rect = g.getBoundingClientRect(); g.setPointerCapture(e.pointerId); });
  g.addEventListener('pointerup', (e) => { if (rect) seekTo(at(e.clientX)); rect = null; });
})();

// sahne jestleri: plağa dokun = çal/durdur, yatay kaydır = parça değiştir
(() => {
  const h = $('hit'); let sx = 0, sy = 0, st = 0;
  h.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; st = performance.now(); });
  h.addEventListener('pointerup', (e) => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && performance.now() - st < 700) { go(dx < 0 ? 1 : -1); return; }
    if (Math.hypot(dx, dy) < 12) {
      const [x, y] = toStage(e.clientX, e.clientY);
      const r = Math.hypot((x - REC.cx) / REC.rx, (y - REC.cy) / REC.ry);
      if (r < 1.05) { fireTap('record', null, e.clientX, e.clientY); if (!tracks.length) pickFolder(); else togglePlay(); }
    }
  });
})();
addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') go(1);
  if (e.code === 'ArrowLeft') go(-1);
});

/* ===========================================================
   BAŞLANGIÇ
   =========================================================== */
let resizeTimer;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(computeView, 80); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { lastT = lastRender = performance.now(); raf = requestAnimationFrame(frame); computeTarget(); }
});

(async function boot() {
  computeView();
  $('vizName').textContent = vizLabel(vizMode);
  $('orderName').textContent = ORDER_NAMES[orderMode];
  computeTarget();
  try {
    if (!glInit()) throw new Error('WebGL2 yok');
    const [scene, maps, disc, sheen, arm] = await Promise.all(['scene.webp', 'maps.png', 'disc.webp', 'sheen.png', 'arm.png'].map(loadImg));
    makeTex(0, 'uScene', scene, false);
    makeTex(1, 'uMaps', maps, false);
    makeTex(2, 'uDisc', disc, true);
    makeTex(3, 'uSheen', sheen, false);
    makeTex(4, 'uArm', arm, true);
    drawLabel(null, null);
    makeTex(5, 'uLabel', labelCanvas, true);
    glReady = true;
  } catch (e) {
    console.error(e);
    $('nogl').style.display = 'block';
  }
  raf = requestAnimationFrame(frame);
  restoreLibrary();
  fetchWeather();
  setInterval(fetchWeather, 20 * 60e3);
  setInterval(computeTarget, 30e3);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
})();
</script>
